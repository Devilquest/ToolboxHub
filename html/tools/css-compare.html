<div class="tool-header">
    <h1><img src="images/tools/css-compare.webp" alt="">CSS Compare</h1>
    <p>Compare two CSS stylesheets to find shared rules, differences, and unique properties</p>
</div>

<div class="card workstation-card">
    <div class="workstation-grid items-2">
        <div class="workstation-panel" id="panel1">
            <h2 class="card-title mb-md">🎨 CSS File 1</h2>
            <div class="upload-area un-gap-md" id="dropZone1">
                <div class="upload-icon mb-sm">
                    <app-icon name="file-css"></app-icon>
                </div>
                <div class="upload-text">Drop a .css file here</div>
                <div class="upload-subtext">or click to browse</div>
            </div>
            <input type="file" id="file1" accept=".css" style="display: none;">
            <div class="file-list">
                <div class="file-info-bar d-none" id="fileInfo1">
                    <span>📄 <span id="fileName1"></span></span>
                    <button type="button" class="btn-clear" id="clearPanel1" title="Clear">✕</button>
                </div>
            </div>
            <textarea id="text1" placeholder="Or paste CSS code here..."></textarea>
        </div>

        <div class="workstation-panel" id="panel2">
            <h2 class="card-title mb-md">🎨 CSS File 2</h2>
            <div class="upload-area un-gap-md" id="dropZone2">
                <div class="upload-icon mb-sm">
                    <app-icon name="file-css"></app-icon>
                </div>
                <div class="upload-text">Drop a .css file here</div>
                <div class="upload-subtext">or click to browse</div>
            </div>
            <input type="file" id="file2" accept=".css" style="display: none;">
            <div class="file-list">
                <div class="file-info-bar d-none" id="fileInfo2">
                    <span>📄 <span id="fileName2"></span></span>
                    <button type="button" class="btn-clear" id="clearPanel2" title="Clear">✕</button>
                </div>
            </div>
            <textarea id="text2" placeholder="Or paste CSS code here..."></textarea>
        </div>
    </div>
    <div class="workstation-controls flex-between items-center">
        <button id="compareBtn" class="btn btn-primary">Compare Codes</button>
        <button id="resetBtn" class="btn btn-secondary">Reset</button>
    </div>
</div>

<div id="resultsContainer" class="card workstation-card card-glow" style="display: none;">
    <div class="workstation-panel">
        <div class="flex-between items-center mb-lg">
            <h2 class="card-title mb-0">Comparison Results</h2>
            <button class="btn btn-primary" id="downloadZipBtn">Download All (.zip)</button>
        </div>
        <div class="stats-panel card card-emphasis mb-lg" id="statsPanel"></div>

        <!-- Output Options -->
        <div class="options-panel mb-lg">


            <label class="checkbox-wrapper" title="Analyzes and compares individual properties within matching CSS rules. Only properties that exist in both files will be highlighted.">
                <input type="checkbox" id="intersectionMode" checked="">
                <span class="checkbox-custom"></span>
                <div class="checkbox-label-content">
                    <div class="flex-row-gap-xs items-center">
                        <span class="checkbox-title">Intersection Mode</span>
                    </div>
                </div>
            </label>
        </div>
    </div>

    <div class="workstation-grid items-3">
        <div class="workstation-panel result-box common">
            <div class="result-box-header">
                <h3>Common Rules</h3>
                <span id="commonCount">0</span>
            </div>
            <div class="result-content">
                <textarea id="commonResult" readonly></textarea>
            </div>
            <div class="workstation-controls result-actions flex-between">
                <button class="btn btn-primary" data-filename="common.css" data-target="commonResult">Download</button>
                <button class="btn btn-tertiary" data-target="commonResult">Copy</button>
            </div>
        </div>

        <div class="workstation-panel result-box unique1">
            <div class="result-box-header">
                <h3 id="unique1Title">Unique to File 1</h3>
                <span id="unique1Count">0</span>
            </div>
            <div class="result-content">
                <textarea id="unique1Result" readonly></textarea>
            </div>
            <div class="workstation-controls result-actions flex-between">
                <button class="btn btn-primary" data-filename="file1.unique.css" data-target="unique1Result">Download</button>
                <button class="btn btn-tertiary" data-target="unique1Result">Copy</button>
            </div>
        </div>

        <div class="workstation-panel result-box unique2">
            <div class="result-box-header">
                <h3 id="unique2Title">Unique to File 2</h3>
                <span id="unique2Count">0</span>
            </div>
            <div class="result-content">
                <textarea id="unique2Result" readonly></textarea>
            </div>
            <div class="workstation-controls result-actions flex-between">
                <button class="btn btn-primary" data-filename="file2.unique.css" data-target="unique2Result">Download</button>
                <button class="btn btn-tertiary" data-target="unique2Result">Copy</button>
            </div>
        </div>
    </div>
</div>
